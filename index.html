<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Given Away</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column read like a painted scroll. A stage panel on top, a sari-border band, then the story panel.
   One deliberate world: indigo night ground, lac red and turmeric from the dyes of the period, archive slips on paper. */
:root {
  --night: #151830;
  --panel: #1e2242;
  --raise: #272c54;
  --line: #3a4070;
  --fg: #efe8d8;
  --muted: #aeaac1;
  --lac: #c8452f;
  --turmeric: #e3a63c;
  --paper: #ece4d1;
  --paper-ink: #2a2420;
  --paper-mark: #8a2e1f;
  --paper-rule: #b9ad94;
  --display: "Rozha One", "Playfair Display", Georgia, serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--night); color: var(--fg); }
body { font-family: var(--body); font-size: 17.5px; line-height: 1.62; margin: 0; }
* { box-sizing: border-box; }

.wrap {
  max-width: 720px; margin: 0 auto;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* HUD */
.hud {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); padding-bottom: 12px;
}
.hud .who { color: var(--fg); }
.hud nav { display: flex; gap: 16px; margin-left: auto; }
.linkbtn {
  background: none; border: 0; padding: 4px 0; cursor: pointer;
  color: var(--muted); font: inherit; letter-spacing: inherit; text-transform: inherit;
  text-decoration: underline; text-underline-offset: 3px;
}
.linkbtn:hover, .linkbtn:focus-visible { color: var(--turmeric); outline: none; }

/* Life thread */
.thread { display: flex; align-items: center; margin: 2px 4px 6px; }
.thread .node { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--night); flex: none; }
.thread .node.done { background: var(--turmeric); border-color: var(--turmeric); }
.thread .node.now { border-color: var(--turmeric); box-shadow: 0 0 0 4px color-mix(in srgb, var(--turmeric) 22%, transparent); }
.thread .seg { height: 2px; flex: 1; background: var(--line); }
.thread .seg.done { background: var(--turmeric); }
.thread-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.thread-labels span.now { color: var(--turmeric); }

/* Stage */
.stage { position: relative; border-radius: 8px 8px 0 0; overflow: hidden; background: var(--raise); aspect-ratio: 400 / 250; max-width: 100%; }
.stage svg { display: block; width: 100%; height: 100%; animation: fadein 0.7s ease both; }
.stage .fig { animation: figin 0.9s ease both; }
.stage .flame { animation: flicker 2.4s ease-in-out infinite; transform-origin: center bottom; transform-box: fill-box; }
.stage .cap {
  position: absolute; left: 10px; bottom: 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  background: color-mix(in srgb, var(--night) 82%, transparent); color: var(--fg);
  padding: 4px 8px; border-radius: 3px;
}
.band {
  height: 16px;
  background:
    linear-gradient(var(--turmeric), var(--turmeric)) 0 0 / 100% 2px no-repeat,
    linear-gradient(var(--turmeric), var(--turmeric)) 0 100% / 100% 2px no-repeat,
    conic-gradient(from 135deg at 50% 0, var(--lac) 90deg, transparent 0) 0 4px / 14px 8px repeat-x,
    var(--panel);
}

/* Story */
.story { background: var(--panel); border-radius: 0 0 8px 8px; padding: 24px 26px 28px; }
.story.solo { border-radius: 8px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--turmeric); }
h1, h2 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.08; color: var(--fg); }
h1 { font-size: clamp(46px, 11vw, 76px); margin: 4px 0 10px; }
h2 { font-size: clamp(30px, 6.4vw, 42px); margin: 6px 0 4px; }
h3 { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--turmeric); font-weight: 500; margin: 26px 0 10px; }
.meta { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
p { margin: 0 0 14px; max-width: 62ch; }
.lede { font-size: 19px; }
.note { font-size: 14.5px; color: var(--muted); }

.reveal > * { animation: rise 0.55s ease both; animation-delay: calc(var(--i, 0) * 90ms); }
@keyframes rise { from { opacity: 0.15; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0.4; } to { opacity: 1; } }
@keyframes figin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes flicker { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08, 0.94); } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

/* Choices */
.choices { display: grid; gap: 10px; margin-top: 22px; }
.choice {
  display: flex; gap: 14px; align-items: baseline; text-align: left;
  background: var(--raise); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
  padding: 14px 16px; font: inherit; cursor: pointer; transition: transform 0.15s, border-color 0.15s;
}
.choice .k { font-family: var(--display); color: var(--turmeric); font-size: 22px; line-height: 1; flex: none; width: 16px; }
.choice:hover, .choice:focus-visible { border-color: var(--turmeric); transform: translateY(-1px); outline: none; }
.keyhint { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 10px; }

.primary {
  background: var(--lac); color: var(--fg); border: 0; border-radius: 6px;
  padding: 13px 22px; font: 600 16px var(--body); cursor: pointer;
}
.primary:hover { filter: brightness(1.08); }
.primary:focus-visible, .ghost:focus-visible { outline: 2px solid var(--turmeric); outline-offset: 2px; }
.primary:disabled { opacity: 0.4; cursor: default; filter: none; }
.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 18px; font: inherit; cursor: pointer; }
.ghost:hover { border-color: var(--turmeric); }
.foot { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }

/* Outcome */
.chosen { font-family: var(--mono); font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--turmeric); padding-left: 10px; margin-bottom: 16px; }
.voice { position: relative; background: var(--raise); border-radius: 10px; padding: 14px 16px; margin: 22px 0 18px; font-style: italic; max-width: 58ch; }
.voice::before { content: ""; position: absolute; left: 22px; top: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--raise); }
.voice .who { display: block; font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--turmeric); margin-bottom: 4px; }

.archive {
  background: var(--paper); color: var(--paper-ink); border-radius: 2px;
  padding: 16px 18px 10px; margin-top: 22px; font-size: 15px; line-height: 1.55;
  transform: rotate(-0.4deg);
}
.archive .head {
  display: flex; justify-content: space-between; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--paper-mark);
  border-bottom: 1px dashed var(--paper-rule); padding-bottom: 6px; margin-bottom: 10px;
}
.archive p { margin: 0 0 10px; }
.archive .src { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--paper-ink); opacity: 0.72; margin-top: 3px; }
.verify { font-family: var(--mono); font-size: 11px; color: var(--lac); white-space: nowrap; }

/* Start screen pickers */
.picker { margin: 18px 0 4px; }
.picker .label { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts.names { display: flex; flex-wrap: wrap; }
.opt {
  background: var(--raise); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
  padding: 11px 14px; font: inherit; text-align: left; cursor: pointer; min-width: 0;
}
.opts.names .opt { padding: 8px 14px; }
.opt small { display: block; font-size: 13.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.opt[aria-pressed="true"] { border-color: var(--turmeric); background: color-mix(in srgb, var(--turmeric) 14%, var(--raise)); }
.opt:hover, .opt:focus-visible { border-color: var(--turmeric); outline: none; }

/* End */
.meter { margin: 14px 0; }
.meter .row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.meter .row span:last-child { font-family: var(--mono); font-size: 14px; }
.meter .sub { font-size: 13.5px; color: var(--muted); }
.meter .track { height: 8px; background: var(--line); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--turmeric); width: 0; transition: width 1s ease; }
.verdict { font-family: var(--display); font-size: clamp(26px, 5.4vw, 34px); line-height: 1.2; margin: 26px 0 8px; padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); text-wrap: balance; }
ul.plain { padding-left: 20px; margin: 0 0 14px; }
ul.plain li { margin-bottom: 8px; }
.srclist p { font-size: 15.5px; margin-bottom: 14px; }
.srclist .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--turmeric); }

@media (max-width: 480px) {
  body { font-size: 16.5px; }
  .story { padding: 20px 16px 24px; }
  .opts { grid-template-columns: 1fr; }
  .thread-labels { font-size: 9.5px; }
}
</style>

</head>
<body>
<div class="wrap">
  <header class="hud">
    <span class="who" id="hudWho">Given Away</span>
    <nav>
      <button class="linkbtn" id="navMethod" type="button">Method</button>
      <button class="linkbtn" id="navSources" type="button">Sources</button>
    </nav>
  </header>
  <div id="thread" hidden></div>
  <div class="stage" id="stage"></div>
  <div class="band" id="band" aria-hidden="true"></div>
  <main class="story" id="app" aria-live="polite"></main>
</div>

<script>
/* =========================================================
   SOURCES: every historical claim in the game points here.
   ========================================================= */
const SOURCES = {
  sarkar: {
    cite: "Sarkar 2009",
    author: "Tanika Sarkar", year: "2009",
    title: "\"Wicked Widows: Law and Faith in Nineteenth-Century Public Sphere Debates\", in Rebels, Wives, Saints: Designing Selves and Nations in Colonial Times (Ranikhet: Permanent Black), pp. 121-52",
    note: "Module 6 reading. The discipline of Hindu widowhood, the 1856 Act and its costs, and the argument that the law lost the social battle while unsettling older certainties.",
    module: "Module 6"
  },
  nair: {
    cite: "Nair 1994",
    author: "Janaki Nair", year: "1994",
    title: "\"The Devadasi, Dharma and the State\", Economic and Political Weekly 29:50, pp. 3157-67",
    note: "Module 6 reading. How the Mysore bureaucracy stripped devadasis of temple roles and land between 1892 and 1909, and how basavi dedication worked among lower castes.",
    module: "Module 6"
  },
  sen: {
    cite: "Sen 2004",
    author: "Samita Sen", year: "2004",
    title: "\"'Without His Consent?': Marriage and Women's Migration in Colonial India\", International Labor and Working-Class History 65, pp. 77-104",
    note: "Module 6 reading. Women's migration to mills, mines and the Assam tea gardens, and the 1901 Act that made a married woman's labour contract depend on her husband's consent.",
    module: "Module 6"
  },
  chokherbali: {
    cite: "Tagore 1903; Ghosh 2003",
    author: "Rabindranath Tagore (novel); Rituparno Ghosh (film)", year: "1903; 2003",
    title: "Chokher Bali",
    note: "Module 6 film. A young widow, Binodini, lives in a Calcutta household where her desire and intelligence unsettle everyone around her. Sarkar lists the novel among the great fictions of widows' love.",
    module: "Module 6"
  },
  guha: {
    cite: "Guha 1987",
    author: "Ranajit Guha", year: "1987",
    title: "\"Chandra's Death\", Subaltern Studies V; reprinted in Partha Chatterjee (ed.), The Small Voice of History (2009), pp. 271-303",
    note: "Module 1 reading. Reconstructs the 1849 death of a lower-caste widow after an abortion arranged by her kin. Sarkar cites it in 'Wicked Widows'.",
    module: "Module 1"
  },
  ambedkar: {
    cite: "Ambedkar 1916",
    author: "B.R. Ambedkar", year: "1916",
    title: "\"Castes in India: Their Mechanism, Genesis and Development\" (paper read at Columbia University; published in Indian Antiquary, 1917)",
    note: "Argues that sati, enforced widowhood and girl marriage kept the numbers of marriageable men and women in balance so that a caste could stay endogamous."
  },
  chakravarti: {
    cite: "Chakravarti 2003",
    author: "Uma Chakravarti", year: "2003",
    title: "Gendering Caste: Through a Feminist Lens (Calcutta: Stree)",
    note: "Brahmanical patriarchy: control of women's sexuality as the means of keeping caste closed, with women as the 'gateways' of caste."
  },
  act1856: {
    cite: "Act XV of 1856",
    author: "Legislative Council of India", year: "1856",
    title: "Hindu Widows' Remarriage Act (Act XV of 1856)",
    note: "Removed the legal bar on Hindu widow remarriage. Section 2 ended a remarried widow's rights in her deceased husband's property as if she had died. Sarkar notes she also lost custody of children from the first marriage."
  },
  vidyasagar: {
    cite: "Vidyasagar (via Sarkar)",
    author: "Ishwar Chandra Vidyasagar", year: "1855-56",
    title: "Campaign and tracts for widow remarriage",
    note: "Used a verse of the Parasharasamhita to argue that scripture allowed remarriage; organised petitions and funded many of the early weddings himself (Sarkar 2009, pp. 123, 134, 148)."
  },
  shinde: {
    cite: "Shinde 1882",
    author: "Tarabai Shinde", year: "1882",
    title: "Stri Purush Tulana (A Comparison of Women and Men)",
    note: "Marathi tract attacking the double standard applied to women and men. Prompted by the trial of a young Brahmin widow, Vijayalakshmi, for killing her newborn."
  },
  ramabai: {
    cite: "Ramabai 1887",
    author: "Pandita Ramabai", year: "1887",
    title: "The High-Caste Hindu Woman (Philadelphia)",
    note: "Money raised from the book helped found the Sharada Sadan for high-caste widows in Bombay in March 1889. It moved to Pune in 1890, and in the early 1890s conversions at the home cost it many Hindu supporters."
  },
  phule: {
    cite: "Phule 1863",
    author: "Jyotirao and Savitribai Phule", year: "1863",
    title: "Home for the prevention of infanticide, Pune",
    note: "A home where pregnant widows could give birth in safety and secrecy."
  },
  rukhmabai: {
    cite: "Dadaji Bhikaji v. Rukhmabai",
    author: "Bombay High Court", year: "1884-88",
    title: "Dadaji Bhikaji v. Rukhmabai (suit for restitution of conjugal rights)",
    note: "Rukhmabai, married as a child, refused to live with her husband. Pinhey J ruled for her in 1885; the appeal court reversed him; in 1887 she was ordered to go to her husband or face six months' imprisonment; the case was settled in 1888. Behramji Malabari campaigned on her behalf."
  },
  aoc1891: {
    cite: "Age of Consent Act 1891",
    author: "Imperial Legislative Council", year: "1891",
    title: "Age of Consent Act (Act X of 1891)",
    note: "Raised the age of consent to sexual intercourse, within marriage too, from ten to twelve. The bill followed the death of Phulmoni, an eleven-year-old Calcutta wife; her husband was tried in 1890."
  },
  sarda: {
    cite: "Sarda Act 1929",
    author: "Imperial Legislative Council", year: "1929",
    title: "Child Marriage Restraint Act (Act XIX of 1929)",
    note: "Fixed the minimum marriage age at fourteen for girls and eighteen for boys from 1 April 1930. It punished those who arranged such marriages but did not make the marriages void."
  },
  sati1829: {
    cite: "Regulation XVII of 1829",
    author: "Government of Bengal", year: "1829",
    title: "Bengal Sati Regulation (Regulation XVII of 1829)",
    note: "Declared sati illegal and punishable in the Bengal Presidency."
  },
  assam1901: {
    cite: "Act VI of 1901 (via Sen)",
    author: "Government of India", year: "1901",
    title: "Assam Labour and Emigration Act (Act VI of 1901)",
    note: "Made it a penal matter to recruit a married woman without her husband's consent, on the reasoning that marriage was a prior contract over her labour (Sen 2004, p. 99)."
  }
};

/* =========================================================
   STATE
   ========================================================= */
const START = {
  "upper-landed": { H: 60, S: 65, A: 15 },
  "upper-poor":   { H: 55, S: 35, A: 15 },
  "lower-landed": { H: 35, S: 50, A: 30 },
  "lower-poor":   { H: 25, S: 25, A: 35 }
};
let s = null;
function newState(caste, cls) {
  const m = START[caste + "-" + cls];
  return { caste, cls, H: m.H, S: m.S, A: m.A, n: 0, path: null, sub: null, scene: 0 };
}
const clamp = v => Math.max(0, Math.min(100, v));
function apply(d) {
  if (!d) return;
  for (const k of ["H", "S", "A"]) if (d[k]) s[k] = clamp(s[k] + d[k]);
}
const U = () => s.caste === "upper";
const L = () => s.cls === "landed";

/* =========================================================
   SCENES
   Each scene: (state) => { title, year, body[], choices[], history? }
   Each choice: { label, d:{H,S,A}, set?, out[], voice:{who,line}, history[] }
   History item: { t: text, src: [keys], pp?: pages }
   ========================================================= */
const SCENES = [

/* ---------- 1. THE MATCH ---------- */
function match() {
  let body;
  if (U() && L()) body = [
    "The astrologer has matched the charts. The boy is fifteen, of your own sub-caste, from a village two days away by bullock cart. Your father has promised gold bangles, a milch cow and a trunk of brass vessels.",
    "Your mother oils your hair and tells you to stop running in the courtyard. A girl must be given away before her first bleeding, she says. Otherwise the sin is on her father."
  ];
  else if (U()) body = [
    "Your father keeps the village shrine and owns no land. The families with young sons ask for more than the house is worth.",
    "The match he can afford is a widower of forty-four who needs someone to run his kitchen and give him a son. Your mother says nothing at dinner. Your father says that a Brahmin girl who stays unmarried past nine will not stay a Brahmin girl for long."
  ];
  else if (L()) body = [
    "Your family farms four bighas of its own and rents three more. The groom's father farms beside the river. He looked at your hands and your shoulders before he looked at your face.",
    "His family will give yours two goats and some silver for you, as is the custom in your caste. Your aunt says you will be strong enough for transplanting by next season."
  ];
  else body = [
    "Your father works another man's fields for a share of the crop, and owes him more every year.",
    "A family across the canal needs a girl who can carry water, weed and cook. They will take you without asking for anything. Your mother says that is the best thing that could have happened."
  ];
  return {
    title: "The match", year: "1879", age: "You are nine.",
    body,
    choices: [
      {
        label: "Stand still while they put the vermilion in your parting.",
        d: { H: 5, A: -5 },
        out: [
          "The rites last most of the night. You fall asleep against your aunt before the end.",
          "In the morning you are a wife. You go back to your parents' house to wait until you are old enough to be sent for."
        ],
        voice: U()
          ? { who: "Your mother", line: "Good. A girl who does not make a fuss brings luck to two houses." }
          : { who: "Your aunt", line: "There. Now you belong somewhere." }
      },
      {
        label: "Refuse. Hide in the cowshed until they find you.",
        d: { H: U() ? -10 : -6 },
        out: [
          "Your uncle finds you before the lamps are lit and carries you to the wedding under his arm. Your crying gets lost among the " + (U() ? "conch shells" : "drums") + ".",
          "The marriage is complete before you stop. You go back to your parents' house to wait until you are sent for."
        ],
        voice: U()
          ? { who: "Your father", line: "Who asked you? A daughter is given. Nobody asks the gift." }
          : { who: "Your grandmother", line: "Cry here, then. Over there you won't have time." }
      }
    ],
    history: [
      { t: "Child marriage was common across castes. Sarkar notes that some widows who remarried under the 1856 Act had been widowed at three or four, and that the 1891 census counted widows under ten as about 6 per cent of all married girls in Bengal.", src: ["sarkar"], pp: "pp. 136-37" },
      { t: "Ambedkar argued that girl marriage, sati and enforced widowhood were devices for keeping a caste endogamous by controlling whom its women could marry.", src: ["ambedkar"] }
    ]
  };
},

/* ---------- 2. YOUR HUSBAND'S HOUSE ---------- */
function house() {
  if (U()) {
    const body = [
      "Your husband's family has sent word. The cart comes for you next week. Your mother spends the days telling you what will be expected.",
      L()
        ? "Your mother-in-law will weigh the dowry gold in her palm and tell the neighbours it is lighter than promised. Your mother says to expect this and to say nothing."
        : "Your husband's first wife died in childbirth. Her two sons are nearly your age. Your mother says not to expect them to call you mother.",
      "You may not enter the kitchen while you bleed. You will eat after the men, from what is left. You will cover your face before your father-in-law and your husband's elder brother and speak to them through a child.",
      "In the evenings your brother reads the newspaper aloud. A woman in Bombay has refused to live with the man she was married to as a child. He has taken her to court."
    ];
    return {
      title: "Your husband's house", year: "1885", age: "You are fifteen.",
      body,
      choices: [
        {
          label: "Go.",
          d: { H: 5, A: -5 },
          out: [
            "Everything your mother described is true, and there is more she left out. Your husband comes to the room at night. In the day he does not look at you in front of his mother.",
            "In 1887 you have a son. After that your mother-in-law lets you sit at the edge of the women on festival days."
          ],
          voice: { who: "Your mother-in-law", line: "In my time a bride did not lift her eyes until her second child." }
        },
        {
          label: "Refuse to go, like the woman in the newspapers.",
          d: { H: -15, S: -5 },
          out: [
            "For a week your father does not speak to you. Then a letter arrives from your husband's family. If you do not come they will go to court, and everyone will read your father's name.",
            "Your father takes you there himself. In Bombay that year a judge rules for the woman in the newspapers. The appeal court overturns him the year after. By then you are pregnant, and your mother-in-law reminds you every day what you nearly cost them. You have a son in 1887."
          ],

const BGALT = {
  courtyard: "in the courtyard of a house", hut: "outside a mud and thatch house", field: "in a rice field",
  town: "on a town street", station: "on a railway platform", ghat: "on the river steps at Kashi",
  school: "outside a school verandah", tea: "among the tea bushes", mill: "outside a jute mill",
  temple: "outside a village temple", steamer: "on a riverbank beside a steamer"
};

function lampSvg(x, y) {
  return `<circle cx="${x}" cy="${y - 16}" r="40" fill="url(#glow)"/>` +
    `<path d="M${x - 15} ${y - 6} Q${x} ${y + 5} ${x + 15} ${y - 6} Z" fill="#a8603a" stroke="${INK}" stroke-width="1.5"/>` +
    `<path class="flame" d="M${x} ${y - 26} Q${x + 5} ${y - 15} ${x} ${y - 8} Q${x - 5} ${y - 15} ${x} ${y - 26} Z" fill="#ffc35a"/>`;
}

function paint(lk) {
  const prefix = lk.age === "child" ? "A girl" : lk.age === "old" ? "An old woman" : "A woman";
  const alt = lk.lamp ? "An oil lamp burning where she stood, " + BGALT[lk.bg] : prefix + " " + DRESS[lk.dress].alt + ", " + BGALT[lk.bg];
  let svg = `<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(alt)}">` + sky(lk.time) + BG[lk.bg](lk);
  if (lk.lamp) svg += lampSvg(268, 238);
  else {
    const sc = lk.age === "child" ? 0.6 : lk.age === "old" ? 0.8 : 0.84;
    svg += `<ellipse cx="268" cy="241" rx="${34 * sc + 6}" ry="4" fill="#000" opacity="0.18"/>`;
    svg += `<g transform="translate(${(268 - 60 * sc).toFixed(1)} ${(240 - 236 * sc).toFixed(1)}) scale(${sc})"><g class="fig">${figure(lk)}</g></g>`;
  }
  return svg + "</svg>";
}

/* Which picture belongs to which moment of her life */
function look(i, phase) {
  const p = s.path, sub = s.sub, rich = L();
  const base = { rich, age: "adult", time: "day", props: [] };
  if (i === 0) return { ...base, bg: U() ? "courtyard" : "hut", time: "dusk", age: "child", dress: phase === "pre" ? "child" : "bride" };
  if (i === 1) return U() ? { ...base, bg: "courtyard", dress: "married" } : { ...base, bg: "field", dress: "worker", props: phase === "pre" ? ["pot"] : [] };
  if (i === 2) {
    if (phase === "pre") return { ...base, bg: U() ? "courtyard" : "hut", time: "night", dress: "mourning" };
    return ({
      remarry: { ...base, bg: "town", dress: "remarried" },
      widow: { ...base, bg: "courtyard", dress: "widow" },
      ranaway: { ...base, bg: "station", time: "dawn", dress: "widow", props: ["bundle"] },
      sanga: { ...base, bg: "hut", dress: "sanga" },
      respectable: { ...base, bg: "field", dress: "widow" },
      migrant: { ...base, bg: "steamer", time: "dawn", dress: "garden", props: ["bundle"] }
    })[p];
  }
  if (i === 3) {
    if (phase === "post" && sub) return ({
      kashi: { ...base, bg: "ghat", time: "dusk", dress: "widow", props: ["bundle"] },
      home: { ...base, bg: "courtyard", time: "night", dress: "widow" },
      teacher: { ...base, bg: "school", dress: "teacher", props: ["book"] },
      returned: { ...base, bg: "courtyard", time: "dusk", dress: "widow" },
      garden: { ...base, bg: "tea", dress: "garden", props: ["basket"] },
      mill: { ...base, bg: "mill", time: "smog", dress: "mill" }
    })[sub];
    return ({
      remarry: { ...base, bg: "town", dress: "remarried" },
      widow: { ...base, bg: "courtyard", time: "night", dress: "widow" },
      ranaway: { ...base, bg: "school", dress: "widow", props: ["book"] },
      sanga: { ...base, bg: "hut", dress: "sanga" },
      respectable: { ...base, bg: "field", dress: "widow" },
      migrant: { ...base, bg: "tea", dress: "garden", props: ["basket"] }
    })[p];
  }
  const old = { ...base, age: "old", time: "dusk", props: ["stick"] };
  if ((p === "sanga" || p === "respectable") && !rich) return { ...old, bg: "temple", dress: p === "sanga" ? "sanga" : "widow" };
  if (p === "sanga") return { ...old, bg: "hut", dress: "sanga" };
  if (p === "respectable") return { ...old, bg: "hut", dress: "widow" };
  if (p === "widow") return sub === "kashi" ? { ...old, bg: "ghat", dress: "widow" } : { ...old, bg: "courtyard", dress: "widow" };
  if (p === "remarry") return { ...old, bg: "town", dress: "remarried" };
  if (p === "ranaway") return sub === "teacher" ? { ...old, bg: "school", dress: "teacher" } : { ...old, bg: "courtyard", dress: "widow" };
  return sub === "garden" ? { ...old, bg: "tea", dress: "garden" } : { ...old, bg: "mill", time: "smog", dress: "mill" };
}

const app = document.getElementById("app");
const stageEl = document.getElementById("stage");
const bandEl = document.getElementById("band");
const threadEl = document.getElementById("thread");
const hudWho = document.getElementById("hudWho");
const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const withVerify = t => esc(t).replace(/\[verify([^\]]*)\]/g, '<span class="verify">[verify$1]</span>');
const NAMES = ["Kusum", "Malati", "Saroj", "Champa", "Bimala", "Sona"];
const LABELS = ["Child", "Wife", "Widow", "After", "Old age"];
let view = "start";
let keyActions = {};

function ps(arr, start) { return arr.map((t, k) => `<p style="--i:${start + k}">${withVerify(t)}</p>`).join(""); }

function histBox(items, year) {
  if (!items || !items.length) return "";
  const rows = items.map(h => {
    const names = h.src.map(k => SOURCES[k].cite).join("; ");
    return "<p>" + withVerify(h.t) + (h.verify ? ' <span class="verify">[verify]</span>' : "") +
      '<span class="src">Source: ' + esc(names) + (h.pp ? ", " + esc(h.pp) : "") + "</span></p>";
  }).join("");
  return `<div class="archive"><div class="head"><span>What actually happened</span><span>${esc(year || "")}</span></div>${rows}</div>`;
}

function showStage(lk, cap) {
  stageEl.hidden = false; bandEl.hidden = false; app.classList.remove("solo");
  stageEl.innerHTML = paint(lk) + (cap ? `<div class="cap">${esc(cap)}</div>` : "");
}
function hideStage() { stageEl.hidden = true; bandEl.hidden = true; app.classList.add("solo"); }

function drawThread(i) {
  if (i == null) { threadEl.hidden = true; return; }
  threadEl.hidden = false;
  let h = '<div class="thread" aria-hidden="true">';
  LABELS.forEach((_, k) => {
    if (k) h += `<div class="seg${k <= i ? " done" : ""}"></div>`;
    h += `<div class="node${k < i ? " done" : k === i ? " now" : ""}"></div>`;
  });
  h += `</div><div class="thread-labels">${LABELS.map((l, k) => `<span class="${k === i ? "now" : ""}">${l}</span>`).join("")}</div>`;
  threadEl.innerHTML = h;
}
const ageWord = a => a.replace(/^You are /, "").replace(/\.$/, "");
function hud(sc) { hudWho.textContent = s ? `${s.name} · age ${ageWord(sc.age)} · ${sc.year}` : "Given Away"; }

function renderStart() {
  view = "start"; s = null; keyActions = {};
  drawThread(null);
  hudWho.textContent = "Given Away";
  let caste = null, cls = null, name = NAMES[0];
  const preview = () => showStage({ bg: caste === "lower" ? "hut" : "courtyard", rich: cls !== "poor", time: "dusk", age: "child", dress: "child", props: [] }, "1879 · before the wedding");
  preview();
  app.innerHTML = `<div class="reveal">
    <div class="eyebrow" style="--i:0">A life in five chapters</div>
    <h1 style="--i:1">Given Away</h1>
    <p class="lede" style="--i:2">You will live one woman's life in colonial India, from 1879 into the 1930s. At each stage you will be offered a choice. Choose carefully. It will not help.</p>
    <div class="picker" style="--i:3"><div class="label">Her name</div>
      <div class="opts names" id="nm">${NAMES.map((n, k) => `<button type="button" class="opt" data-v="${n}" aria-pressed="${k === 0}">${n}</button>`).join("")}</div></div>
    <div class="picker" style="--i:4"><div class="label">Her family's caste</div>
      <div class="opts" id="caste">
        <button type="button" class="opt" data-v="upper" aria-pressed="false">Upper caste (Brahmin)<small>The strictest rules on marriage and widowhood.</small></button>
        <button type="button" class="opt" data-v="lower" aria-pressed="false">Lower caste, labouring family<small>Older customs allow remarriage. The work and the landlord's men are another matter.</small></button>
      </div></div>
    <div class="picker" style="--i:5"><div class="label">Her family's means</div>
      <div class="opts" id="cls">
        <button type="button" class="opt" data-v="landed" aria-pressed="false">Landed<small>There is property, which means there is something to lose.</small></button>
        <button type="button" class="opt" data-v="poor" aria-pressed="false">Poor<small>There is no land and no savings. Every bad harvest becomes a debt.</small></button>
      </div></div>
    <p class="note" style="--i:6;margin-top:18px">Three hidden measures, Honour, Security and Autonomy, change with every choice and are revealed at the end. Content note: child marriage, domestic violence, sexual exploitation, abortion and death. These happen in the text only; nothing is shown on screen.</p>
    <div class="foot" style="--i:7;margin-top:8px"><button type="button" class="primary" id="begin" disabled>Begin her life</button></div>
  </div>`;
  const begin = document.getElementById("begin");
  const wire = (id, setter) => {
    const box = document.getElementById(id);
    box.querySelectorAll("button").forEach(b => b.onclick = () => {
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");

      begin.disabled = !(caste && cls);
    });
  };
  wire("nm", v => name = v);
  wire("caste", v => { caste = v; preview(); });
  wire("cls", v => { cls = v; preview(); });
  begin.onclick = () => { s = newState(caste, cls); s.name = name; renderScene(); };
}

function renderScene() {
  view = "scene";
  const sc = SCENES[s.scene]();
  hud(sc); drawThread(s.scene);
  showStage(look(s.scene, "pre"), `${sc.year} · age ${ageWord(sc.age)}`);
  const n = sc.body.length;
  app.innerHTML = `<div class="reveal">
    <div class="eyebrow" style="--i:0">Chapter ${s.scene + 1} of ${SCENES.length}</div>
    <h2 style="--i:1">${esc(sc.title)}</h2>
    <div class="meta" style="--i:2">${esc(sc.year)} · ${esc(sc.age)}</div>
    ${ps(sc.body, 3)}
    <div class="choices" id="ch" style="--i:${3 + n}"></div>
    <div class="keyhint" style="--i:${4 + n}">Choose with a click, or press ${sc.choices.map((_, k) => k + 1).join(", ")}.</div>
  </div>`;
  const ch = document.getElementById("ch");
  keyActions = {};
  sc.choices.forEach((c, k) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice";
    b.innerHTML = `<span class="k">${k + 1}</span><span>${esc(c.label)}</span>`;
    b.onclick = () => choose(sc, c);
    ch.appendChild(b);
    keyActions[String(k + 1)] = b.onclick;
  });
  window.scrollTo(0, 0);
}

function choose(sc, c) {
  apply(c.d);
  if (c.set) s.path = c.set;
  if (c.sub) s.sub = c.sub;
  s.n++;
  s.last = { sc, c };
  s.lastScene = s.scene;
  renderOutcome(sc, c);
}

function renderOutcome(sc, c) {
  view = "outcome";
  hud(sc); drawThread(s.scene);
  showStage(look(s.scene, "post"), `${sc.year} · age ${ageWord(sc.age)}`);
  const hist = (c.history || []).concat(sc.history || []);
  const last = s.scene + 1 >= SCENES.length;
  app.innerHTML = `<div class="reveal">
    <div class="eyebrow" style="--i:0">Chapter ${s.scene + 1} of ${SCENES.length}</div>
    <h2 style="--i:1">${esc(sc.title)}</h2>
    <div class="chosen" style="--i:2">You chose: ${esc(c.label)}</div>
    ${ps(c.out, 3)}
    <div class="voice" style="--i:${3 + c.out.length}"><span class="who">${esc(c.voice.who)}</span>"${esc(c.voice.line)}"</div>
    <div style="--i:${4 + c.out.length}">${histBox(hist, sc.year)}</div>
    <div class="foot" style="--i:${5 + c.out.length}"><button type="button" class="primary" id="next">${last ? "See how her life ended" : "Continue to chapter " + (s.scene + 2)}</button></div>
  </div>`;
  const go = () => { s.scene++; if (s.scene < SCENES.length) renderScene(); else renderEnd(); };

}

function meter(name, sub, v) {
  return `<div class="meter"><div class="row"><span>${name}</span><span>${v} / 100</span></div>
    <div class="sub">${sub}</div><div class="track"><div class="fill" data-w="${v}"></div></div></div>`;
}

function renderEnd() {
  view = "end"; keyActions = {};

  app.innerHTML = `<div class="reveal">
    <div class="eyebrow" style="--i:0">The end of her life</div>
    <h2 style="--i:1">${esc(s.name)}</h2>
    <p style="--i:2">${esc(epilogue().replace(/^She /, s.name + " "))}</p>

    <div style="--i:4">

function currentContext() {
  if (view === "end") return "end";
  if (view === "scene" || view === "outcome") return "game";
  if (view === "method" || view === "sources") return null;
  return "start";
}
let backTo = "start";
function backButton(from) {
  return `<div class="foot"><button type="button" class="primary" id="back">${from === "end" ? "Back to her life" : from === "game" ? "Back to the game" : "Back to the start"}</button></div>`;
}
function wireBack(from) {
  document.getElementById("back").onclick = () => {
    if (from === "end") renderEnd();

      if (s.last && s.lastScene === s.scene) renderOutcome(s.last.sc, s.last.c); else renderScene();
    } else renderStart();
  };
}
function pageFrom(from) {
  const ctx = currentContext();
  if (from) return from;
  if (ctx) { backTo = ctx; return ctx; }
  return backTo;
}

function renderMethod(from) {
  from = pageFrom(from); backTo = from;
  view = "method"; keyActions = {};

    <div class="meta">How this game was built and what it leaves out</div>
    <p>The woman you play is a composite. She is no single historical person, and her family's lines are written for the game; none of them quotes a real individual. Every named person, case and statute in the "What actually happened" slips is real. Each slip names its source, and the full list is on the Sources page.</p>
    <p>The game is built around Module 6 (Gender and Law) of History-2. Its three readings supply most of the history: Tanika Sarkar's "Wicked Widows" for the upper-caste widow and the 1856 Act, Janaki Nair's "The Devadasi, Dharma and the State" for temple dedication and the basavi, and Samita Sen's "Without His Consent?" for women's migration to the mills and tea gardens. The module film, Chokher Bali, shapes one branch of the widow's story. Ranajit Guha's "Chandra's Death" from Module 1 appears where Sarkar cites it.</p>
    <h3>About the pictures</h3>
    <p>The figure has no face, so she can stand for many women. Her skin tone stays the same in every life. Caste and class show in her work and her clothes, and the clothes follow the record: a married woman wears vermilion in her parting and conch and lac bangles, while a widow wears unbordered white with her head covered. Labouring women wear coarse cotton. Violence and tonsuring are described in the text and never drawn. When her life ends, an oil lamp takes her place on screen.</p>
    <h3>What is simplified</h3>
    <p>Region is the biggest simplification. The upper-caste path draws mainly on Bengal (Sarkar), with Bombay and Pune for Rukhmabai, Ramabai, the Phules and Tarabai Shinde. The lower-caste path mixes Bengal, Bihar and Chhotanagpur (Sen) with Mysore (Nair, for the basavi). Customs on remarriage, dowry, bride-price and seclusion differed sharply between these places.</p>
    <p>Two categories stand in for a graded hierarchy of hundreds of jatis. The "lower caste" path merges cultivating Shudra castes, Dalit labouring castes and the Adivasi communities from which Assam recruiters drew heavily. Oppression was graded, as Ambedkar and Chakravarti argue, and the game shows only two of its grades.</p>
    <p>The game covers Hindu women only. Muslim, Christian and Parsi women lived under different personal laws, which Module 6 also covers. Landed and poor are likewise two points on a long scale of class.</p>
    <p>Fitting one life between 1870 and the 1930s compresses events. Some are placed where they fall in her lifetime; for example, she would only have read about Rukhmabai's case once it reached the newspapers in 1885. Finally, Honour, Security and Autonomy are a device for showing trade-offs. The numbers measure nothing real.</p>
    <h3>Whose voices</h3>
    <p>Most of the record comes from reformers, officials, magistrates, census takers and later scholars. Women's own words survive mainly in a few published writings and in court depositions. The game inherits that bias: it can describe her life in detail but cannot recover how she understood it.</p>
    <h3>What the game's argument flattens</h3>
    <p>The game argues that every choice was rigged. Sarkar's reading is more complicated. She argues that the 1856 Act lost the social battle but unsettled older certainties and made new ideas, including equality and consent, sayable for the first time. Sen likewise shows that migration, though exploitative, was sometimes the only exit from an oppressive family. A player who comes away thinking nothing ever changed has missed half of what these historians argue.</p>
    ${backButton(from)}`;
  wireBack(from);
  window.scrollTo(0, 0);
}

function renderSources(from) {
  from = pageFrom(from); backTo = from;
  view = "sources"; keyActions = {};
  hideStage(); drawThread(null); hudWho.textContent = "Sources";
  const order = ["sarkar", "nair", "sen", "chokherbali", "guha", "ambedkar", "chakravarti", "act1856", "vidyasagar", "shinde", "ramabai", "phule", "rukhmabai", "aoc1891", "sarda", "sati1829", "assam1901"];
  app.innerHTML = `
    <h2>Sources</h2>
    <div class="meta">Every historical claim in the game points to one of these</div>
    <div class="srclist">
      ${order.map(k => {
        const x = SOURCES[k];
        return `<p>${x.module ? '<span class="tag">' + esc(x.module.toUpperCase()) + "</span><br>" : ""}<strong>${esc(x.author)}</strong> (${esc(x.year)}). ${esc(x.title)}.<br>${withVerify(x.note)}</p>`;
      }).join("")}
    </div>
    ${backButton(from)}`;
  wireBack(from);
  window.scrollTo(0, 0);
}

document.getElementById("navMethod").onclick = () => renderMethod();
document.getElementById("navSources").onclick = () => renderSources();
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Enter" && document.activeElement && document.activeElement.tagName === "BUTTON" && document.activeElement.id !== "next") return;
  const f = keyActions[e.key];
  if (f) { e.preventDefault(); f(); }
});

/* Keep a game in progress when the page is updated while open */
window.claude?.hot?.snapshot?.(() => ({ s, view }));
function start(data) {
  try {
    if (data && data.s) {
      s = data.s;
      if (data.view === "end") return renderEnd();
      if (s.last && s.lastScene === s.scene) return renderOutcome(s.last.sc, s.last.c);
      if (s.scene < SCENES.length) return renderScene();
    }
  } catch (e) { /* fall through to a fresh start */ }
  renderStart();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
